<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#08090C">
  <title>Offline-Recumend</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #08090C;
      color: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      user-select: none;
    }
    .card {
      background: #121212;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
    }
    .dot {
      color: #E11D48;
    }
    .icon-box {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: #F59E0B;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 13px;
      color: #A1A1AA;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #D4D4D8;
      margin-bottom: 24px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #F59E0B;
      box-shadow: 0 0 8px #F59E0B;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    .btn {
      background: #FFFFFF;
      color: #08090C;
      font-weight: 700;
      font-size: 13px;
      padding: 12px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      min-height: 44px;
      width: 100%;
      justify-content: center;
    }
    .btn:active {
      transform: scale(0.97);
      background: #E4E4E7;
    }
    .btn.checking {
      opacity: 0.7;
      pointer-events: none;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #08090C;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span>recumend</span><span class="dot">•</span>
    </div>

    <div class="icon-box">
      <!-- Wifi Off SVG -->
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>No Internet Connection</h1>
    <p>Please check your Wi-Fi or mobile data network. Recumend will automatically reconnect once available.</p>

    <div class="status-pill">
      <span class="pulse-dot" id="pulseDot"></span>
      <span id="statusText">Waiting for network...</span>
    </div>

    <button type="button" class="btn" id="retryBtn" onclick="manualRetry()">
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">Retry Now</span>
    </button>
  </div>

  <script>
    const TARGET_URL = "https://recumend.vercel.app";
    let isChecking = false;

    async function checkConnection() {
      if (isChecking) return;
      isChecking = true;

      const statusText = document.getElementById("statusText");
      const pulseDot = document.getElementById("pulseDot");

      if (statusText) statusText.innerText = "Reconnecting...";
      if (pulseDot) pulseDot.style.background = "#38BDF8";

      try {
        // Fast cache-busted probe to test reachability
        await fetch(TARGET_URL + "/logo.png?_probe=" + Date.now(), {
          method: "HEAD",
          mode: "no-cors",
          cache: "no-store"
        });

        if (statusText) statusText.innerText = "Connected! Loading...";
        if (pulseDot) pulseDot.style.background = "#34D399";

        // Seamless switch to live app
        window.location.replace(TARGET_URL);
      } catch (err) {
        if (statusText) statusText.innerText = "Waiting for network...";
        if (pulseDot) pulseDot.style.background = "#F59E0B";
        isChecking = false;
      }
    }

    async function manualRetry() {
      const btn = document.getElementById("retryBtn");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnText = document.getElementById("btnText");

      if (btn) btn.classList.add("checking");
      if (btnSpinner) btnSpinner.style.display = "inline-block";
      if (btnText) btnText.innerText = "Checking...";

      await checkConnection();

      setTimeout(() => {
        if (btn) btn.classList.remove("checking");
        if (btnSpinner) btnSpinner.style.display = "none";
        if (btnText) btnText.innerText = "Retry Now";
      }, 1000);
    }

    // Auto-detect when device network turns back on
    window.addEventListener("online", checkConnection);

    // Heartbeat probe every 3 seconds
    setInterval(checkConnection, 3000);
  </script>
</body>
</html>
